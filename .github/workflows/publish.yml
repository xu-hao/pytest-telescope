name: Publish to PyPI
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify release tag and license decision
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PYTHON'
          import os
          import pathlib
          import tomllib
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
          if os.environ["RELEASE_TAG"] != "v" + project["version"]:
              raise SystemExit("Release tag must match the package version")
          if not project.get("license") or not pathlib.Path("LICENSE").is_file():
              raise SystemExit("Choose and record the license before publishing")
          PYTHON
      - name: Build and verify distribution and Sphinx documentation
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install '.[dev]'
          .venv/bin/python scripts/check.py --artifacts "$RUNNER_TEMP/telescope-release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: ${{ runner.temp }}/telescope-release/dist/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pytest-telescope
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist/
      - name: Publish verified distributions with the PyPI API token
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          repository-url: https://upload.pypi.org/legacy/
          attestations: false
