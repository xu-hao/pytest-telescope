name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    # Scoped tests need bwrap to create user, mount and PID namespaces. An earlier hosted
    # Ubuntu 24.04 run could not set up bwrap's namespaces; Ubuntu 22.04 runners could.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
        pytest: ["pytest==8.3.5", "pytest>=9,<10"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Bubblewrap
        run: sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
      - name: Create isolated development environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install '.[dev]' '${{ matrix.pytest }}'
      - name: Check installed distribution and strict Sphinx documentation
        run: .venv/bin/python scripts/check.py --artifacts "$RUNNER_TEMP/telescope-check"
