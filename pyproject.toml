[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "pytest-telescope"
version = "0.1.0a1"
description = "Declared inputs. Isolated tests. Focused reruns."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["pytest>=8.3,<10"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: Pytest",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Repository = "https://github.com/xu-hao/pytest-telescope"
Issues = "https://github.com/xu-hao/pytest-telescope/issues"

[project.scripts]
pytest-telescope = "pytest_telescope.controller:main"

[project.entry-points.pytest11]
telescope = "pytest_telescope.plugin"

[project.optional-dependencies]
dev = ["build>=1.2,<2", "ruff>=0.9,<1", "mkdocs==1.6.1", "twine>=6,<7"]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/pytest_telescope"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
  "/src", "/tests", "/scripts", "/docs", "/examples", "/benchmarks", "/README.md", "/CONTRIBUTING.md",
  "/LICENSE", "/pyproject.toml", "/mkdocs.yml", "/.readthedocs.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
