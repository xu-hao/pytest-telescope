[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers"

[tool.pytest_telescope]
test_roots = ["tests"]

[tool.pytest_telescope.bundles.common]
inputs = ["tests/conftest.py", "demoapp/__init__.py", "demoapp/common.py"]

[tool.pytest_telescope.bundles.scoring]
inputs = ["demoapp/scoring.py", "data/customers.json"]
bundles = ["common"]

[tool.pytest_telescope.bundles.demand]
inputs = ["demoapp/demand.py", "data/demand.json"]
bundles = ["common"]

[tool.pytest_telescope.bundles.pricing]
inputs = ["demoapp/pricing.py", "data/prices.json"]
bundles = ["common"]
